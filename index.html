<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ルーレット</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #616e7c;
      --border: #d3d8de;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --pointer: #d62828;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14171c;
        --panel: #1f242c;
        --text: #e4e7eb;
        --muted: #9aa5b1;
        --border: #3e4651;
        --accent: #3b82f6;
        --pointer: #f25c54;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 16px;
      display: grid;
      gap: 24px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 760px) {
      main { grid-template-columns: 3fr 2fr; align-items: start; }
    }
    h1 { margin: 0 0 4px; font-size: 1.5rem; grid-column: 1 / -1; }
    .wheel-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .wheel-wrap {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .pointer {
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 32px solid var(--pointer);
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.3));
    }
    button {
      font: inherit;
      font-size: 1.125rem;
      padding: 12px 40px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-text);
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      min-height: 2.5rem;
      font-size: 1.5rem;
      font-weight: 700;
      text-align: center;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    textarea {
      width: 100%;
      min-height: 240px;
      font: inherit;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      resize: vertical;
    }
    .hint { color: var(--muted); font-size: 0.875rem; margin: 8px 0 0; }
    .check { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <h1>ルーレット</h1>
    <section class="wheel-area">
      <div class="wheel-wrap">
        <canvas id="wheel" width="960" height="960" aria-label="ルーレット盤"></canvas>
        <div class="pointer" aria-hidden="true"></div>
      </div>
      <button id="spin" type="button">スタート</button>
      <div id="result" class="result" aria-live="polite"></div>
    </section>
    <section class="panel">
      <label for="items">項目(1行に1項目)</label>
      <textarea id="items"></textarea>
      <p class="hint">2項目以上を入力してください。入力内容はこのブラウザに保存されます。</p>
      <label class="check"><input type="checkbox" id="removeWinner">当選した項目を次回から除外する</label>
    </section>
  </main>

  <script>
    const DEFAULT_ITEMS = ["A", "B", "C", "D", "E", "F"];
    const STORAGE_KEY = "roulette-items";
    const COLORS = ["#4e79a7", "#f28e2b", "#e15759", "#76b7b2", "#59a14f", "#edc948", "#b07aa1", "#ff9da7", "#9c755f", "#bab0ac"];
    const SPIN_MS = 4500;
    const TAU = Math.PI * 2;
    const POINTER_ANGLE = -Math.PI / 2; // 盤面の真上

    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const itemsEl = document.getElementById("items");
    const spinBtn = document.getElementById("spin");
    const resultEl = document.getElementById("result");
    const removeWinnerEl = document.getElementById("removeWinner");

    let rotation = 0;
    let spinning = false;

    function loadItems() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved !== null) return saved;
      } catch (e) { /* ストレージ不可の環境では既定値を使う */ }
      return DEFAULT_ITEMS.join("\n");
    }

    function saveItems() {
      try { localStorage.setItem(STORAGE_KEY, itemsEl.value); } catch (e) { /* 無視 */ }
    }

    function getItems() {
      return itemsEl.value.split("\n").map(s => s.trim()).filter(s => s.length > 0);
    }

    function draw() {
      const items = getItems();
      const size = canvas.width;
      const c = size / 2;
      const r = c - 8;
      ctx.clearRect(0, 0, size, size);

      if (items.length === 0) {
        ctx.beginPath();
        ctx.arc(c, c, r, 0, TAU);
        ctx.fillStyle = "#bab0ac";
        ctx.fill();
        return;
      }

      const seg = TAU / items.length;
      items.forEach((label, i) => {
        const start = rotation + i * seg;
        ctx.beginPath();
        ctx.moveTo(c, c);
        ctx.arc(c, c, r, start, start + seg);
        ctx.closePath();
        // 項目数が色数+1で割り切れる場合に隣接色が重複しないよう調整
        let colorIndex = i % COLORS.length;
        if (i === items.length - 1 && items.length > 1 && colorIndex === 0) colorIndex = 1;
        ctx.fillStyle = COLORS[colorIndex];
        ctx.fill();
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.save();
        ctx.translate(c, c);
        ctx.rotate(start + seg / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        const fontSize = Math.max(20, Math.min(48, 360 / items.length + 12));
        ctx.font = `bold ${fontSize}px system-ui, sans-serif`;
        ctx.fillText(truncate(label, r * 0.7, ctx), r - 24, 0);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(c, c, r * 0.08, 0, TAU);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
    }

    function truncate(text, maxWidth, context) {
      if (context.measureText(text).width <= maxWidth) return text;
      let t = text;
      while (t.length > 1 && context.measureText(t + "…").width > maxWidth) t = t.slice(0, -1);
      return t + "…";
    }

    function randomFloat() {
      const buf = new Uint32Array(1);
      crypto.getRandomValues(buf);
      return buf[0] / 2 ** 32;
    }

    function indexAtPointer(count) {
      const seg = TAU / count;
      const a = (((POINTER_ANGLE - rotation) % TAU) + TAU) % TAU;
      return Math.floor(a / seg) % count;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function spin() {
      const items = getItems();
      if (spinning) return;
      if (items.length < 2) {
        resultEl.textContent = "項目を2つ以上入力してください";
        return;
      }
      spinning = true;
      spinBtn.disabled = true;
      itemsEl.disabled = true;
      resultEl.textContent = "";

      // 当選項目を一様に選び、境界線上で止まらないよう区画の内側 10%〜90% の位置に止める
      const seg = TAU / items.length;
      const target = Math.floor(randomFloat() * items.length);
      const offset = (target + 0.1 + randomFloat() * 0.8) * seg;
      const finalRotation = ((POINTER_ANGLE - offset) % TAU + TAU) % TAU;
      const from = rotation;
      const delta = ((finalRotation - from) % TAU + TAU) % TAU;
      const to = from + TAU * (5 + Math.floor(randomFloat() * 3)) + delta;
      const startTime = performance.now();

      function frame(now) {
        const t = Math.min(1, (now - startTime) / SPIN_MS);
        rotation = from + (to - from) * easeOutCubic(t);
        draw();
        if (t < 1) {
          requestAnimationFrame(frame);
          return;
        }
        rotation %= TAU;
        const winner = items[indexAtPointer(items.length)];
        resultEl.textContent = `結果: ${winner}`;
        spinning = false;
        spinBtn.disabled = false;
        itemsEl.disabled = false;
        if (removeWinnerEl.checked) {
          const lines = itemsEl.value.split("\n");
          const idx = lines.findIndex(s => s.trim() === winner);
          if (idx >= 0) lines.splice(idx, 1);
          itemsEl.value = lines.join("\n");
          saveItems();
          draw();
        }
      }
      requestAnimationFrame(frame);
    }

    itemsEl.value = loadItems();
    itemsEl.addEventListener("input", () => { saveItems(); draw(); });
    spinBtn.addEventListener("click", spin);
    draw();
  </script>
</body>
</html>
